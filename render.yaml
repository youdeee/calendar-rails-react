services:
  - type: web
    name: calendar-backend
    runtime: ruby
    rootDir: backend
    plan: free
    buildCommand: bundle install && bundle exec rails db:migrate
    # preDeployCommand: bundle exec rails db:migrate  # Render restricts preDeployCommand to paid instance types; free-tier services run migrations as part of buildCommand instead.
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
